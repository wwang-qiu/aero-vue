<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档管理</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout">
    <div class="sider">
      <h3>航空知识库</h3>
      <a href="index.html">首页</a>
      <a href="user.html">用户管理</a>
      <a href="document.html" class="active">文档管理</a>
      <a href="AIchat.html">AI问答</a>
    </div>

    <div class="content">
      <h2>我的文档</h2>
      <div class="search">
        <input type="text" id="searchInput" placeholder="请输入文件名">
        <button id="searchBtn">搜索</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>文件名</th>
            <th>大小</th>
            <th>上传时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="documentList"></tbody>
      </table>
      <br>
      <input type="file" id="fileInput" hidden> <!--让用户选择文件  先把他隐藏起来-->
      <button id="upBtn">上传材料</button>
    </div>
  </div>
  <script src="document.js"></script>
</body>

</html>
