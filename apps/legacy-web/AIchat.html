<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI聊天页面</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout">
    <div class="sider">
      <h3>航空知识库</h3>
      <a href="index.html">首页</a>
      <a href="user.html">用户管理</a>
      <a href="document.html">文档管理</a>
      <a href="AIchat.html" class="active">AI问答</a>
    </div>

    <div class="content">
      <h2>航空助手</h2>
      <div class="chat-box" id="chatBox">
        <div>AI：你好，我可以回答航空相关问题。</div>
      </div>
      <div class="chat-item">
        <input type="text" id="question" placeholder="请输入问题">
        <button id="clearBtn">清空聊天</button>
        <button id="sendBtn">发送</button>
      </div>
    </div>
  </div>
  <script src="AIchat.js"></script>
</body>

</html>
